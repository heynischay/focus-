name: Run on Push 

on: 
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint


  build:
      needs: lint
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - name: Use Nodejs
          uses: actions/setup-node@v3
          with: 
            node-version: '20'
        
        - name : Install Dependencies 
          run : npm install

        - name : Generate Prisma Client
          run : npx prisma generate



        - name : Run Build
          run : npm run build
